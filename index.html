<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <title>Student Grade Calculator</title>
</head>

<body>
    <h1>STUDENT GRADE CALCULATOR</h1>

    <form>
        <!-- Student Info -->
        <label for="firstName">FIRST NAME</label><br>
        <input type="text" id="firstName"><br><br>

        <label for="lastName">LAST NAME</label><br>
        <input type="text" id="lastName"><br><br>

        <h3>ENTER YOUR GRADES:</h3>

        <label for="science">SCIENCE</label><br>
        <input type="number" id="science" placeholder="e.g. 85"><br><br>

        <label for="english">ENGLISH</label><br>
        <input type="number" id="english" placeholder="e.g. 90"><br><br>

        <label for="ict">ICT</label><br>
        <input type="number" id="ict" placeholder="e.g. 88"><br><br>

        <label for="math">MATH</label><br>
        <input type="number" id="math" placeholder="e.g. 92"><br><br>

        <label for="filipino">FILIPINO</label><br>
        <input type="number" id="filipino" placeholder="e.g. 87"><br><br>

        <label for="pe">PHYSICAL EDUCATION</label><br>
        <input type="number" id="pe" placeholder="e.g. 95"><br><br>

        <button type="button" id="calculateBtn" py-click="compute_average">
            CALCULATE GWA
        </button>
    </form>

    <br>
    <div id="output"></div>

    <py-script src="main.py"></py-script>
</body>
</html>
